
services:
  - type: web
    name: iitm-code-interpreter
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: AIPIPE_TOKEN
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://aipipe.org/openrouter/v1
      - key: AI_MODEL
        value: openai/gpt-4.1-nano
